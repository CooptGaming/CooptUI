; ================================================
; Sell Protection Flags
; ================================================
; Items with these flags will NEVER be sold
; TRUE = protect (never sell), FALSE = allow selling
; ================================================

[Settings]
protectNoDrop=TRUE
protectNoTrade=TRUE
protectLore=FALSE
protectQuest=FALSE
protectCollectible=TRUE
protectHeirloom=TRUE
protectAttuneable=FALSE
protectAugSlots=FALSE
; Epic quest items (class-filtered via epic_classes.ini) are never sold.
; TRUE matches the code's built-in default — turn off only if you know why.
protectEpic=TRUE
; Sell engine: macro = run sell.mac, lua = native Lua sell (default; faster, no macro)
sellMode=lua
; Lua sell: TRUE = print each sold item to console (default FALSE)
sellVerboseLog=FALSE
