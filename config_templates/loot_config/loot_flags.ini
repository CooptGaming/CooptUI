; ================================================
; Loot Flag-Based Rules
; ================================================
; Rules for looting items based on special flags
; TRUE = enable, FALSE = disable
; ================================================

[Settings]
lootClickies=FALSE
lootQuest=FALSE
lootCollectible=FALSE
lootHeirloom=FALSE
lootAttuneable=FALSE
lootAugSlots=FALSE
; Epic quest items (for classes enabled in epic_classes.ini) are always looted,
; even when other rules would skip them. TRUE matches the code's built-in default.
alwaysLootEpic=TRUE
lootDelayTicks=2
; Real-time loot feed lines for the Loot UI (non-optional; the UI keeps this TRUE)
enableLiveLootFeed=TRUE
maxLoopIterations=1000
pauseOnMythicalNoDropNoTrade=TRUE
alertMythicalGroupChat=TRUE
testMythicalPause=FALSE
testMythicalPauseItem=
quietMode=FALSE
approachWaitTicks=8
